<title>Voice Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* A small separate page for Juan, once (2026-10-14): does the writing sound like him? Same look as the Approval Room, same recorded decision. Nothing here is an article approval. */
:root{
  --ink:#0d1b2e; --ink-2:#4a5568; --paper:#f6f4f0; --card:#ffffff; --line:#d9d5cc; --accent:#c2410c; --accent-ink:#ffffff; --ok:#17673b; --ok-bg:#e3f2e8;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8ecf2; --ink-2:#a7b1c1; --paper:#0c1626; --card:#13233a; --line:#2a3b55; --accent:#f08a4b; --accent-ink:#0c1626; --ok:#7fd3a0; --ok-bg:#12331f; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8ecf2; --ink-2:#a7b1c1; --paper:#0c1626; --card:#13233a; --line:#2a3b55; --accent:#f08a4b; --accent-ink:#0c1626; --ok:#7fd3a0; --ok-bg:#12331f; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--font-body);margin:0;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0 0 8px}
.meta{color:var(--ink-2);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
blockquote{margin:10px 0;padding:4px 14px;border-left:4px solid var(--line);font-size:17px}
.ask{border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;padding:12px 16px;margin:0;font-size:17px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;box-sizing:border-box;min-height:56px;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
button{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
.fine{font-size:13px;color:var(--ink-2);margin:0}
h2{font-size:17px;line-height:1.3;margin:0 0 8px}
ul.list{margin:0;padding-left:20px}ul.list li{margin:0 0 6px}
details summary{cursor:pointer;font-weight:600}
details summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pair{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
</style>

<script type="application/json" id="payload">{"id":"voice-reference:96c68595bb3a","hash":"96c68595bb3a41c818bed897cd8b3ef8c6b36f39a1a57eee1797349b354afe85","excerpts":[{"text":"Age alone isn't the problem."},{"text":"What matters is the condition of the property today, and whether the paperwork tells the same story as the house."},{"text":"None of these mean the house can't sell. They mean you want to know about them before you pick a path."},{"text":"A house full of belongings is not always a junk problem. Sometimes it is a family history problem."}],"imitate":["Speak as Juan explaining the truth to a homeowner: first person where advice is given ('I'd want these answered', 'the first question I ask'), plain words, short declarative sentences.","Name the real question first ('The real question is usually...'), then answer it. Say 'Not always.' or 'It depends on...' when that is the honest answer.","Be honest about options, including ones that are not Twin Home Buyer. Say what each fits and what it costs the seller in time, certainty or control.","Treat the family and the person living in the house with respect. No judgment, no pity, no sales energy.","Close a section on what the seller can do next or what to confirm, not on a pitch.","Educate first, sell second. Explain the real problem before any solution, and give the seller something useful even if they never call us.","Open on the seller's situation so the seller feels understood: the practical truth first, plain and direct. No sales-pitch opening and no soft opening: no 'contact us', no 'we buy', no cash-offer line in the first sentences.","Plain, strong, useful: say the hard part directly, then say what to do about it. No filler, no fake motivation, no generic seller promises.","On anything legal, tax, title or code related, say what you do not know and tell the seller who to confirm it with: an attorney, a title company, a CPA or a tax professional ('confirm this with a real estate attorney or your title company'). This is phrasing only; the facts come from the claim ledger.","Local realities are phrasing, not facts: name the kinds of problems Bay Area sellers run into (older homes, expensive repairs, tenants, probate, liens, title issues, family disagreement, costly delays) as things to check or ask about, never as a statistic or a claim about how common or costly they are. Any specific local fact must be a claim in the ledger; deal details come only from ledger facts and approved story cards (SR-18 to SR-20)."],"avoid":["Any number, year, price, timeline, count or percentage that is not in the claim ledger (the excerpts contain none on purpose).","Past-tense claims about deals, outcomes or what 'I have seen' or 'we have bought'. First person is for explaining and advising, not for evidence.","The belongings post's hedged 'may be able to' promises, its leave-behind / as-is / privacy / timeline claims, and its sales-flavored closes.","Juan's page's company-capability claims ('we can purchase', 'we close'), its track-record line and anything about founding, ownership or licences.","Generic seller filler, fake motivation, and any sentence that could sit unchanged on another investor's site."],"banned_phrases":[{"dont":"Selling your house can be stressful.","write_like_juan":"The stressful part is not always the sale. Sometimes the real problem is title, repairs, tenants, family disagreement, or whether escrow can actually close."},{"dont":"We buy houses fast for cash.","write_like_juan":"A fast cash offer only helps if the right person can sign, the paperwork is clean, and the deal can close without surprises."},{"dont":"Contact us today for a fair offer.","write_like_juan":"Before you decide what to do, understand the house, the paperwork, the repairs, and the timeline. Then you can decide whether listing, keeping it, or selling directly makes sense."},{"dont":"We make selling easy.","write_like_juan":"We look at the actual situation: condition, title, tenants, liens, timing, and what the seller really needs."},{"dont":"Sell your inherited house quickly.","write_like_juan":"If you inherited a house, the first question is whether you have legal authority to sell. A trust, will, probate case, or multiple heirs can all change the process."}],"all_excerpts":["Age alone isn't the problem.","What matters is the condition of the property today, and whether the paperwork tells the same story as the house.","This is the part most homeowners get backwards when selling an older home in San Francisco. The repairs that feel most important, like the dated kitchen, are often the ones that matter least to the sale. The repairs that remove uncertainty usually matter most.","Before a homeowner writes a check to a contractor, I ask them to answer these honestly. If the answer to all three isn't yes, the repair probably isn't the right first move.","Not always. When you're selling an older home in San Francisco, renovation can make sense when you have time, the scope is clear, and the work fixes something buyers will actually object to.","Renovation usually makes less sense when you inherited the property, don't want to manage construction, the repair list keeps growing, or your timeline matters more than finishing improvements.","When a homeowner tells me they're selling an older home in San Francisco, the first question I ask is not how much renovation can we do. It's what situation is this homeowner actually in?","None of these mean the house can't sell. They mean you want to know about them before you pick a path.","Maybe the property was inherited and the family needs to decide what comes next. Maybe the home needs work, but the homeowner doesn't know where to begin. Each of those leads to a different answer, and a good decision starts with the right information.","Getting clarity early usually creates more options, not fewer.","A legitimate buyer should be honest about that tradeoff rather than pretending every property is best sold to them.","Credibility is often easier to spot in how clearly someone explains risk than in how confidently they make promises.","At Twin Home Buyer, we want homeowners to feel informed before they make any decision, whether they choose to work with us or not.","Confidence does not need urgency to survive scrutiny.","Most people do not delay selling because they want the process to be harder. They delay because the house feels too heavy to deal with.","A house full of belongings is not always a junk problem. Sometimes it is a family history problem.","Many families do not need to be judged. They need time, clarity, and a practical way to move forward.","For adult children, heirs, or family members, deciding what to keep can be emotional.","The real question is usually this: are the repairs worth doing before I sell, or am I about to spend money that won't come back?","The right approach depends on the home's condition, the repairs needed, your timeline, your budget, and your goals.","A trust, will, probate case, or multiple heirs can each change who signs and how long the process takes.","A probate attorney or title company can tell you which applies.","Confirm what applies to you with a real estate attorney or your escrow or title company.","It is a fair concern because selling a house is too important to leave to guesswork, especially when the property needs repairs, the timeline is tight, or the seller is already under stress.","Any buyer worth taking seriously should be comfortable with you reviewing the paperwork, comparing alternatives, or having an attorney or family member look at the agreement before you sign.","Family disagreement is another reason these situations get stuck."],"question":"These example lines guide how future articles are written in your voice. Confirm once and we won't ask again."}</script>
<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var app = document.getElementById('app');
  function el(tag, attrs, kids){ var e=document.createElement(tag); for (var k in (attrs||{})) { if (k==='text') e.textContent=attrs[k]; else if (k==='class') e.className=attrs[k]; else e.setAttribute(k, attrs[k]); } (kids||[]).forEach(function(c){ if(c) e.appendChild(c); }); return e; }
  if (!P || !P.id) { app.appendChild(el('h1',{text:'Voice Check'})); app.appendChild(el('div',{class:'card',text:'Nothing is waiting for you here right now.'})); return; }
  app.appendChild(el('p',{class:'meta',text:'Twin Home Buyer · one quick question for Juan'}));
  app.appendChild(el('h1',{text:'Does this sound like you?'}));
  var card = el('div',{class:'card'});
  card.appendChild(el('p',{text:P.question}));
  (P.excerpts||[]).forEach(function(x){ card.appendChild(el('blockquote',{text:x.text})); });
  app.appendChild(card);
  function listCard(title, items){ var c = el('div',{class:'card'}); c.appendChild(el('h2',{text:title})); var ul = el('ul',{class:'list'}); items.forEach(function(t){ ul.appendChild(el('li',{text:t})); }); c.appendChild(ul); return c; }
  if ((P.imitate||[]).length) app.appendChild(listCard('How the writing should sound', P.imitate));
  if ((P.avoid||[]).length) app.appendChild(listCard('What the writing must avoid', P.avoid));
  if ((P.banned_phrases||[]).length || (P.all_excerpts||[]).length) {
    var more = el('details',{class:'card'}); more.appendChild(el('summary',{text:'Everything else this answer covers (rewrite examples and all '+(P.all_excerpts||[]).length+' example lines)'}));
    (P.banned_phrases||[]).forEach(function(b){ var d = el('div',{class:'pair'}); d.appendChild(el('p',{class:'fine',text:'Not like this: '+b.dont})); d.appendChild(el('p',{text:'Like this: '+b.write_like_juan})); more.appendChild(d); });
    if ((P.all_excerpts||[]).length) { var d2 = el('div',{class:'pair'}); d2.appendChild(el('p',{class:'fine',text:'All example lines'})); var ul2 = el('ul',{class:'list'}); P.all_excerpts.forEach(function(t){ ul2.appendChild(el('li',{text:t})); }); d2.appendChild(ul2); more.appendChild(d2); }
    app.appendChild(more);
  }
  app.appendChild(el('p',{class:'ask',text:'Do these lines sound like you?'}));
  var note = el('textarea',{id:'note','aria-label':'Your note',placeholder:'Optional: what should sound different?'});
  var status = el('p',{class:'fine',id:'status',text:'Checking your sign-in…'});
  var row = el('div',{class:'row'}); var buttons=[];
  [['approve','Yes, sounds like me','primary'],['request_changes','Needs changes','']].forEach(function(d){
    var b = el('button',{type:'button',class:d[2],id:'btn-'+d[0],text:d[1]}); b.disabled=true; buttons.push(b);
    b.addEventListener('click', function(){ decide(d[0]); }); row.appendChild(b);
  });
  app.appendChild(row); app.appendChild(note); app.appendChild(status);
  app.appendChild(el('p',{class:'fine',text:"Asked once. Your answer is saved against your own account. This is not an article approval, and nothing is published."}));
  var state = { db:null, uid:null, me:null };
  async function decide(decision){
    if (!state.db || !state.uid) { status.textContent='Not signed in with write access: your answer cannot be saved.'; return; }
    buttons.forEach(function(b){b.disabled=true;});
    try {
      // the same record shape as the Approval Room: proposal (here the voice item's id), item, decision, claimed hash, note, time, name
      var rec = { proposalId:P.id, itemKind:'voice_reference', decision:decision, claimedHash:P.hash, note:note.value||'', decidedAt:new Date().toISOString(), displayName:(state.me&&state.me.name)||'' };
      await state.db.collection('decisions/'+state.uid+'/records').doc(P.id+'__voice_reference').set(rec);
      await state.db.doc('people/'+state.uid).set({ displayName:rec.displayName, lastSeen:rec.decidedAt });
      status.textContent = 'Saved: '+decision.replace('_',' ')+'. Thank you. Leo will read it back.';
    } catch(e){ status.textContent = 'Could not save ('+(e&&e.code||'error')+'). '+(e&&e.message||''); }
    buttons.forEach(function(b){b.disabled=false;});
  }
  (async function(){
    try {
      if (!window.claude || !window.claude.use) throw new Error('no runtime');
      state.db = await window.claude.use('db'); var user = await window.claude.use('user');
      if (user) { state.uid = await user.id(); state.me = await user.me(); }
      var can = user ? await user.can('data.write') : null;
      var ok = !!(state.db && state.uid) && can !== false;
      buttons.forEach(function(b){ b.disabled=!ok; });
      status.textContent = ok ? 'Signed in as '+((state.me&&state.me.name)||'your account')+'. Your answer is saved against your own account.' : 'You can read this page, but your account cannot save an answer yet. Ask Leo.';
      if (ok) state.db.collection('decisions/'+state.uid+'/records').doc(P.id+'__voice_reference').onSnapshot(function(s){ if(s.exists){ var d=s.data(); status.textContent='Your saved answer: '+String(d.decision).replace('_',' ')+' ('+d.decidedAt+').'; } }, function(){});
    } catch(e){ status.textContent='Saving is unavailable in this view. You can still read the page.'; }
  })();
})();
</script>
