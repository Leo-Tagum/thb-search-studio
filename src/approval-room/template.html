<title>THB Approval Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Display only. Three parts: (1) the top, a 30-second decision in plain English; (2) the article as readers will see it; (3) one collapsed section of notes
   for AI and the team (everything technical lives there). The decision records, the version check and the approval logic are unchanged. */
:root{
  --ink:#0d1b2e; --ink-2:#4a5568; --paper:#f6f4f0; --card:#ffffff; --line:#d9d5cc; --accent:#c2410c; --accent-ink:#ffffff;
  --ok:#17673b; --ok-bg:#e3f2e8; --warn:#8a5a00; --warn-bg:#fbefd2; --bad:#9b1c1c; --bad-bg:#fbe3e3; --code-bg:#ece8df;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e8ecf2; --ink-2:#a7b1c1; --paper:#0c1626; --card:#13233a; --line:#2a3b55; --accent:#f08a4b; --accent-ink:#0c1626;
  --ok:#7fd3a0; --ok-bg:#12331f; --warn:#f0c46a; --warn-bg:#3a2d0d; --bad:#f19a9a; --bad-bg:#3b1616; --code-bg:#0f1c30; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#e8ecf2; --ink-2:#a7b1c1; --paper:#0c1626; --card:#13233a; --line:#2a3b55; --accent:#f08a4b; --accent-ink:#0c1626;
  --ok:#7fd3a0; --ok-bg:#12331f; --warn:#f0c46a; --warn-bg:#3a2d0d; --bad:#f19a9a; --bad-bg:#3b1616; --code-bg:#0f1c30; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body);margin:0;padding-inline:16px;padding-block:16px 28px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 8px;text-wrap:balance}
h3{font-size:15px;margin:12px 0 4px}
p{margin:0 0 8px}
.meta{color:var(--ink-2);font-size:13px}
.mono{font-family:var(--font-mono);font-size:12px;background:var(--code-bg);padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--code-bg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;box-sizing:border-box;min-height:52px;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
button{font:inherit;font-weight:600;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.5;cursor:not-allowed}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:6px 8px}
.scroll{overflow-x:auto}
.preview{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
ul{margin:4px 0 8px;padding-left:20px}
.top{display:flex;flex-direction:column;gap:10px}
.lead{font-size:15px;margin:0}
.check{display:flex;gap:8px;align-items:flex-start;margin:0}
.ask{border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0;padding:10px 14px;margin:0}
.ask b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-bottom:2px}
.fine{font-size:12.5px;color:var(--ink-2);margin:0}
.alert{border-left:4px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:0 6px 6px 0;font-weight:600}
details.notes{border:1px solid var(--line);border-radius:10px;background:var(--card)}
details.notes>summary{cursor:pointer;font-weight:600;padding:12px 16px}
details.notes .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.notes-sec{border-top:1px solid var(--line);padding-top:12px}
</style>

<div class="wrap">
  <section class="top" id="top" aria-label="Decision"></section>
  <section id="article-sec"></section>
  <details class="notes" id="notes"><summary>Notes for AI and the team</summary><div class="inner" id="notes-body"></div></details>
</div>

<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var top = document.getElementById('top');
  function el(tag, attrs, kids){ var e=document.createElement(tag); for (var k in (attrs||{})) { if (k==='text') e.textContent=attrs[k]; else if (k==='class') e.className=attrs[k]; else e.setAttribute(k, attrs[k]); } (kids||[]).forEach(function(c){ if(c) e.appendChild(c); }); return e; }
  function txt(s){ return document.createTextNode(s); }

  if (!P || !P.proposal_id) {
    top.appendChild(el('h1',{text:'THB Approval Room'}));
    if (P && P.hold_note) top.appendChild(el('div',{class:'card',role:'status'},[el('p',{class:'lead'},[el('b',{text:'On hold. '}), txt(P.hold_note)])]));
    else top.appendChild(el('div',{class:'card',text:'Nothing is waiting for review right now. The next guide will appear here, at this same address.'}));
    document.getElementById('notes').hidden = true;
    return;
  }
  var T = P.top || {};
  document.title = P.article.title;

  async function sha256Hex(s){
    if (!(window.crypto && crypto.subtle)) return null;
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  var state = { db:null, user:null, uid:null, me:null };

  // ---------- 1. TOP: one screen, plain English ----------
  top.appendChild(el('p',{class:'meta',text:'Twin Home Buyer · guide for your approval'}));
  top.appendChild(el('h1',{id:'title',text:P.article.title}));
  top.appendChild(el('p',{class:'lead',text:T.purpose || ''}));
  top.appendChild(el('p',{class:'check'},[el('span',{class:'pill ok',text:'Checked'}), el('span',{text:T.leo_check || ''})]));
  if (T.question) top.appendChild(el('p',{class:'ask'},[el('b',{text:'Question for you'}), txt(T.question)]));

  var items = P.items || [];
  var art = items.filter(function(i){ return i.kind==='article'; })[0] || { kind:'article', hash:'', browserHash:'' };
  var ctl = {};   // per item: { note, status, buttons }
  var alertBox = el('div',{class:'alert',role:'alert',hidden:'hidden',text:'This page does not match the version it was sent with. Please do not approve it; tell Leo.'});
  top.appendChild(alertBox);

  // One set of controls per item; the saved record has the same shape as before (proposal, item, decision, claimed hash, note, time, name).
  function controls(it, specs, placeholder){
    var note = el('textarea',{id:'note-'+it.kind,'aria-label':'Your note',placeholder:placeholder});
    var status = el('p',{class:'fine',id:'status-'+it.kind,text:'Checking your sign-in…'});
    var row = el('div',{class:'row'}); var buttons = [];
    specs.forEach(function(d){
      var b = el('button',{type:'button',class:d[2],id:'btn-'+it.kind+'-'+d[0],text:d[1]}); b.disabled=true; buttons.push(b);
      b.addEventListener('click', function(){ decide(it, d[0], ctl[it.kind]); });
      row.appendChild(b);
    });
    ctl[it.kind] = { note:note, status:status, buttons:buttons };
    return { row:row, note:note, status:status };
  }
  var ac = controls(art, [['approve','Approve','primary'],['hold','Hold',''],['request_changes','Request changes','']], 'Optional: your note, what to change, or your answer to the question above');
  top.appendChild(ac.row); top.appendChild(ac.note);
  top.appendChild(el('p',{class:'fine',text:T.fine_print || "Your approval is for this exact version. If anything changes later, we'll ask you again. Approving doesn't publish it."}));
  top.appendChild(ac.status);

  // The version check is unchanged: the browser recomputes the article's hash; the server checks it again on sync.
  if (art.hash) sha256Hex(P.html).then(function(h){
    if (h===null) { art.browserHash = art.hash; }
    else if (h===art.hash) { art.browserHash = h; }
    else { art.browserHash = h; art.mismatch = true; alertBox.hidden = false; }
  });

  // The voice reference is Juan's to confirm and is NOT part of an article approval (2026-10-14): he confirms it once on a separate page.

  async function decide(it, decision, c){
    if (!state.db || !state.uid) { c.status.textContent='Not signed in with write access: your decision cannot be saved.'; return; }
    if (it.mismatch && decision==='approve') { c.status.textContent='This page does not match its version: not saved as an approval.'; return; }
    c.buttons.forEach(function(b){b.disabled=true;});
    try {
      var rec = { proposalId:P.proposal_id, itemKind:it.kind, decision:decision, claimedHash:it.browserHash||it.hash, note:c.note.value||'', decidedAt:new Date().toISOString(), displayName:(state.me&&state.me.name)||'' };
      await state.db.collection('decisions/'+state.uid+'/records').doc(P.proposal_id+'__'+it.kind).set(rec);
      await state.db.doc('people/'+state.uid).set({ displayName:rec.displayName, lastSeen:rec.decidedAt });
      c.status.textContent = 'Saved: '+decision.replace('_',' ')+'. Thank you. Leo will read it back and the version is rechecked on the server.';
    } catch(e){ c.status.textContent = 'Could not save ('+(e&&e.code||'error')+'). '+(e&&e.message||''); }
    c.buttons.forEach(function(b){b.disabled=false;});
  }

  // ---------- 2. THE ARTICLE ----------
  var asec = document.getElementById('article-sec');
  var pv = el('section',{class:'card'}); pv.appendChild(el('h2',{text:'The guide, as readers will see it'}));
  pv.appendChild(el('p',{class:'meta',text:'The text only. The site header, footer, menus and review widget are added by the website.'}));
  var imgs = P.images && P.images.length ? P.images : null;
  if (imgs) { var allChecked = imgs.every(function(i){ return !!i.leo_check; }); pv.appendChild(el('p',{class:'meta',text:'This version includes '+imgs.length+' image'+(imgs.length===1?'':'s')+'. Your approval covers the words and the images together. '+(allChecked ? 'Leo has checked every image.' : 'Leo has not finished checking the images.')})); }
  var host = el('div',{class:'preview'}); pv.appendChild(host);
  // Images are stored in the article as tokens (the version hash pins the exact files); the web addresses below are for this preview only and are not part of any hash.
  var shown = P.html;
  if (P.image_urls) shown = shown.replace(/src="studio-image:([0-9a-f-]{36})#([0-9a-f]{64})"/g, function(m,id,sha){ var u = P.image_urls[id+'#'+sha]; return u ? 'src="'+String(u).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"' : m; });
  try { var root = host.attachShadow({mode:'open'}); var wrapper=document.createElement('div'); wrapper.innerHTML = shown; root.appendChild(wrapper); } catch(e){ host.textContent='Preview unavailable in this view.'; }
  asec.appendChild(pv);

  // ---------- 3. NOTES FOR AI AND THE TEAM (collapsed) ----------
  var nb = document.getElementById('notes-body');
  nb.appendChild(el('p',{class:'meta',text:"You don't need to read this. If you ask Claude about this article, it uses these notes."}));
  if (P.ai_summary && P.ai_summary.length) {
    var sm = el('div'); sm.appendChild(el('h2',{text:'Summary in plain English'}));
    P.ai_summary.forEach(function(b){ sm.appendChild(el('h3',{text:b.title})); if (b.text) sm.appendChild(el('p',{text:b.text})); if (b.items && b.items.length){ var u=el('ul'); b.items.forEach(function(t){u.appendChild(el('li',{text:t}));}); sm.appendChild(u); } });
    nb.appendChild(sm);
  }
  (P.notes_for_juan||[]).forEach(function(n){
    var s = el('div',{class:'notes-sec'}); s.appendChild(el('h2',{text:n.title})); if (n.intro) s.appendChild(el('p',{class:'meta',text:n.intro}));
    if (n.items && n.items.length){ var u=el('ul'); n.items.forEach(function(t){u.appendChild(el('li',{text:t}));}); s.appendChild(u); }
    nb.appendChild(s);
  });
  var ev = el('div',{class:'notes-sec'});
  ev.appendChild(el('h2',{text:'What is in this version'}));
  var tbl = el('table'); tbl.appendChild(el('thead',{},[el('tr',{},['Section','Words','Status','Claims'].map(function(h){return el('th',{text:h});}))]));
  var tb = el('tbody'); P.sections.forEach(function(s){ tb.appendChild(el('tr',{},[el('td',{text:s.heading}),el('td',{text:String(s.words)}),el('td',{text:s.status}),el('td',{text:s.claims.join(', ')||'none'})])); }); tbl.appendChild(tb);
  ev.appendChild(el('div',{class:'scroll'},[tbl]));
  ev.appendChild(el('p',{class:'meta',text:'Agent reviews recorded: '+P.review_summary.reviews+'. Advisory editorial score (average): '+(P.review_summary.advisory_editorial_score_avg==null?'n/a':P.review_summary.advisory_editorial_score_avg)+'. '+P.review_summary.note}));
  nb.appendChild(ev);

  var cl = el('div',{class:'notes-sec'});
  cl.appendChild(el('h2',{text:'Legal and factual claims used, with their sources'}));
  var ct = el('table'); ct.appendChild(el('thead',{},[el('tr',{},['Id','Claim (wording locked after verification)','Risk','Source'].map(function(h){return el('th',{text:h});}))]));
  var cb = el('tbody'); P.claims.forEach(function(c){ var srcCell=el('td'); if(c.source_url){ var a=el('a',{href:c.source_url,target:'_blank',rel:'noopener',text:c.source||'source'}); srcCell.appendChild(a);} else srcCell.textContent=c.source||'none'; cb.appendChild(el('tr',{},[el('td',{text:c.id}),el('td',{text:c.text}),el('td',{text:c.risk}),srcCell])); }); ct.appendChild(cb);
  cl.appendChild(el('div',{class:'scroll'},[ct]));
  nb.appendChild(cl);

  if (imgs) {
    var is = el('div',{class:'notes-sec'});
    is.appendChild(el('h2',{text:'Images in this version'}));
    is.appendChild(el('p',{class:'meta',text:P.images_statement || ''}));
    var itb = el('table'); itb.appendChild(el('thead',{},[el('tr',{},['Image','File','Exact image text, and the sentence it was copied from','Claim and legal label','Same words as the article'].map(function(h){return el('th',{text:h});}))]));
    var itbody = el('tbody');
    imgs.forEach(function(i){
      var words = el('td'); i.text_lines.forEach(function(l){ words.appendChild(el('div',{text:'\u201c'+l.text+'\u201d'})); words.appendChild(el('div',{class:'fine',text:'From '+l.source})); });
      var cl2 = el('td'); i.text_lines.forEach(function(l){ cl2.appendChild(el('div',{text:l.claim_ids.length ? l.claim_ids.join(', ')+(l.label ? ' ('+l.label+')' : '') : 'no legal claim'})); });
      itbody.appendChild(el('tr',{},[el('td',{text:i.title}), el('td',{},[el('div',{text:i.file_name}), el('div',{class:'fine',text:'Version '+i.version_no+' · '+i.size}), el('div',{class:'fine mono',text:'sha-256 '+i.fingerprint+'…'})]), words, cl2, el('td',{text:i.matches_locked_text ? 'yes' : 'NO'})]));
    });
    itb.appendChild(itbody); is.appendChild(el('div',{class:'scroll'},[itb]));
    var chk = el('ul'); imgs.forEach(function(i){
      chk.appendChild(el('li',{text:i.title+': picture check '+(!i.vision_run ? 'not run' : (i.vision_flags.length ? 'flagged: '+i.vision_flags.join('; ') : 'raised no flags'))+'. '+(i.leo_check ? 'Leo checked it ('+i.leo_check.at+'): '+i.leo_check.note : 'Leo has not checked it yet.')+(i.stripped && i.stripped.length ? ' Removed from the file: '+i.stripped.join(', ')+'.' : '')}));
    });
    is.appendChild(chk);
    if (P.image_history && P.image_history.length) { is.appendChild(el('h3',{text:'Who did what'})); var hl = el('ul'); P.image_history.forEach(function(h){ hl.appendChild(el('li',{text:h.at+' · '+h.who+' · '+h.step+': '+h.detail})); }); is.appendChild(hl); }
    nb.appendChild(is);
  }
  if (P.open_items && P.open_items.length) { var oi = el('div',{class:'notes-sec'}); oi.appendChild(el('h2',{text:'Open items from the brief'})); var ul=el('ul'); P.open_items.forEach(function(t){ul.appendChild(el('li',{text:t}));}); oi.appendChild(ul); if (P.open_items_note) oi.appendChild(el('p',{class:'fine',text:P.open_items_note})); nb.appendChild(oi); }

  var ids = el('div',{class:'notes-sec'});
  ids.appendChild(el('h2',{text:'Version ids'}));
  var idl = el('ul');
  idl.appendChild(el('li',{},[txt('Proposal: '), el('span',{class:'mono',text:P.proposal_id}), txt(' · created '+P.created_at)]));
  (P.items||[]).filter(function(i){return i.kind==='article';}).forEach(function(i){ idl.appendChild(el('li',{},[txt('Article version hash (what an approval is tied to): '), el('span',{class:'mono',text:i.hash})])); });
  var hashLine = el('li',{text:'Browser check of the text shown above: running…'}); idl.appendChild(hashLine);
  ids.appendChild(idl); nb.appendChild(ids);
  if (art && art.hash) sha256Hex(P.html).then(function(h){ hashLine.textContent = h===null ? 'Browser check of the text shown above: this browser cannot recompute it (the server still does).' : (h===art.hash ? 'Browser check of the text shown above: matches the version hash.' : 'Browser check of the text shown above: DOES NOT MATCH the version hash. Do not approve.'); });

  // Capabilities light up after load; the page reads fine without them.
  (async function(){
    try {
      if (!window.claude || !window.claude.use) throw new Error('no runtime');
      state.db = await window.claude.use('db'); state.user = await window.claude.use('user');
      if (state.user) { state.uid = await state.user.id(); state.me = await state.user.me(); }
      var can = state.user ? await state.user.can('data.write') : null;
      var ok = !!(state.db && state.uid) && can !== false;
      Object.keys(ctl).forEach(function(k){
        var c = ctl[k];
        c.buttons.forEach(function(b){ b.disabled=!ok; });
        c.status.textContent = ok ? 'Signed in as '+((state.me&&state.me.name)||'your account')+'. Your decision is saved against your own account.' : 'You can read this page, but your account cannot save decisions yet. Ask Leo.';
        if (ok) state.db.collection('decisions/'+state.uid+'/records').doc(P.proposal_id+'__'+k).onSnapshot(function(s){ if(s.exists){ var d=s.data(); c.status.textContent='Your saved decision: '+String(d.decision).replace('_',' ')+' ('+d.decidedAt+').'; } }, function(){});
      });
    } catch(e){ Object.keys(ctl).forEach(function(k){ ctl[k].status.textContent='Decisions are unavailable in this view. You can still read the guide.'; }); }
  })();
})();
</script>
