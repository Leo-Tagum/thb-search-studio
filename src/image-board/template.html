<title>Image Board</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout concept: one card, one task, one next action. A dashboard of image cards first; the next unfinished card is open; inside it a five-step line and exactly one orange button.
   Palette: navy headings on a light ground; orange is reserved for the single next action. Type: Bricolage Grotesque for titles, Instrument Sans for everything else. */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --ink: #1a2540; --ink-2: #53607c; --line: #dde3ee; --soft: #eef1f7;

  --todo: #56627f; --todo-bg: #e9edf5; --prog: #1b4fb3; --prog-bg: #e3ecfd; --done: #17623a; --done-bg: #dcf3e4;
  --alert: #8a2b2b; --alert-bg: #fdecec; --alert-line: #f0c4c4; --lock-bg: #f0f2f7; --focus: #1f5fd1; --shadow: 0 1px 2px rgba(20,33,61,.06), 0 4px 14px rgba(20,33,61,.06);

}

  --bg: #0f1626; --surface: #172039; --ink: #eef1f8; --ink-2: #b3bdd4; --line: #2c3758; --soft: #1e2946;
  --navy: #f1f4fb; --orange: #ff8a3d; --orange-hover: #ffa566; --on-orange: #1a1206;
  --todo: #c0c8dc; --todo-bg: #27324f; --prog: #9dbcff; --prog-bg: #1d2f58; --done: #86dfa8; --done-bg: #17382a;
  --alert: #ffb0b0; --alert-bg: #3f1c1c; --alert-line: #6b3333; --lock-bg: #1c2642; --focus: #7aa8ff; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #172039; --ink: #eef1f8; --ink-2: #b3bdd4; --line: #2c3758; --soft: #1e2946;
  --navy: #f1f4fb; --orange: #ff8a3d; --orange-hover: #ffa566; --on-orange: #1a1206;
  --todo: #c0c8dc; --todo-bg: #27324f; --prog: #9dbcff; --prog-bg: #1d2f58; --done: #86dfa8; --done-bg: #17382a;

body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 60px; }
h1, h2, h3 { font-family: var(--display); color: var(--navy); margin: 0; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.fixture { background: var(--soft); border: 1px dashed var(--ink-2); color: var(--ink-2); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; margin-bottom: 18px; }

/* dashboard */
.eyebrow { font: 700 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.top h1 { font-size: 32px; line-height: 1.15; }
.progress { margin: 14px 0 6px; font-size: 18px; font-weight: 600; color: var(--navy); }
.bar { height: 10px; border-radius: 999px; background: var(--todo-bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--done); border-radius: 999px; }
.fine { color: var(--ink-2); font-size: 14px; margin: 8px 0 0; }
.dash { list-style: none; margin: 18px 0 22px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.dash button { width: 100%; text-align: left; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.dash button:hover { border-color: var(--navy); }
.dash .tt { flex: 1 1 200px; min-width: 0; font-weight: 600; color: var(--navy); }
.dash .nx { color: var(--ink-2); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; padding: 4px 12px 4px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.s-todo { color: var(--todo); background: var(--todo-bg); } .s-prog { color: var(--prog); background: var(--prog-bg); } .s-done { color: var(--done); background: var(--done-bg); }

/* card */
.cards { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.card.open { border-color: var(--navy); }
.card-head { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; text-align: left; background: transparent; border: 0; padding: 16px 20px; cursor: pointer; }
.card-head .n { font: 700 13px/1 var(--display); background: var(--navy); color: var(--surface); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.card-head h2 { font-size: 21px; line-height: 1.2; flex: 1 1 220px; min-width: 0; }
.chev { color: var(--ink-2); font-size: 13px; }
.card-body { padding: 4px 20px 22px; display: flex; flex-direction: column; gap: 22px; border-top: 1px solid var(--line); }
.card-body > :first-child { margin-top: 18px; }

.steps5 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; position: relative; }

.steps5 li:first-child::before { display: none; }
.steps5 li.done::before, .steps5 li.cur::before { background: var(--done); }

.steps5 li.done .dot { background: var(--done); border-color: var(--done); color: var(--surface); }

.steps5 li.cur { color: var(--navy); font-weight: 700; }

/* next action */
.next { background: var(--soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.next .say { font-size: 17px; color: var(--navy); font-weight: 600; flex: 1 1 220px; }
.next .say small { display: block; font-weight: 400; font-size: 14px; color: var(--ink-2); }
.btn { cursor: pointer; border: 1.5px solid var(--navy); background: var(--surface); color: var(--navy); font-weight: 600; border-radius: 10px; padding: 8px 15px; font-size: 15px; display: inline-block; text-align: center; }
.btn:hover { background: var(--soft); }
.btn.go { background: var(--orange); border-color: var(--orange); color: var(--on-orange); font-size: 17px; padding: 12px 22px; font-weight: 700; }
.btn.go:hover { background: var(--orange-hover); border-color: var(--orange-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); text-decoration: underline; padding: 6px 8px; font-weight: 500; }
.banner { border-radius: 12px; padding: 12px 16px; background: var(--alert-bg); border: 1px solid var(--alert-line); color: var(--alert); }
.banner b { display: block; font-size: 17px; }
.banner p { margin: 4px 0 0; color: var(--ink); }
.banner.ok { background: var(--done-bg); border-color: transparent; color: var(--done); }
.banner.ok p { color: var(--ink); }

/* sections */
.sec h3 { font: 700 13px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; }
.sec p { margin: 0; }
.purpose { font-size: 17px; font-weight: 500; color: var(--navy); }
.where { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.idea { font-size: 17px; line-height: 1.65; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.sample { background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink-2); font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.hint { color: var(--ink-2); font-size: 14px; }
.copied { color: var(--done); font-weight: 600; font-size: 14px; }

.lock li { padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 18px; font-weight: 600; color: var(--ink); user-select: all; }
.lock li:last-child { border-bottom: 0; }

.lock .note svg { flex: none; margin-top: 3px; }

.thumb { width: 128px; height: 72px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); object-fit: cover; display: block; flex: none; }

.in { padding: 0 16px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--alert-bg); color: var(--alert); border-radius: 6px; padding: 3px 9px; font-size: 14px; font-weight: 500; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 15px; margin: 0; }
.spec dt { color: var(--ink-2); } .spec dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.vers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.vers li:first-child { border-top: 0; padding-top: 0; }

.tag.cur { background: var(--done-bg); color: var(--done); } .tag.old { background: var(--alert-bg); color: var(--alert); } .tag.rep { background: var(--todo-bg); color: var(--todo); }
.thread { display: flex; flex-direction: column; gap: 8px; margin: 0 0 10px; padding: 0; list-style: none; }
.msg { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
.msg b { color: var(--navy); } .msg time { color: var(--ink-2); font-size: 13px; margin-left: 6px; }
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); }
.foot { margin-top: 24px; color: var(--ink-2); font-size: 14px; }
@media (max-width: 520px) { .top h1 { font-size: 26px; } .steps5 li { font-size: 12px; } .card-head, .card-body { padding-inline: 14px; } .btn.go { width: 100%; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
