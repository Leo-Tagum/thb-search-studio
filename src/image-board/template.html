<style>
/* Layout concept: one article, a short list of image jobs. Each card reads top to bottom as the job does: where it goes, the prompt to copy, the exact words to add, the file to hand in.
   Palette: THB navy and orange on a light background. Type: Bricolage Grotesque for titles, Instrument Sans for everything else. */
:root {

  --navy: #eef1f8; --orange: #ff8a3d; --orange-ink: #ffa566; --orange-soft: #3a2415;
  --todo: #b3bcd3; --todo-bg: #25304f; --prog: #ffcb70; --prog-bg: #3d2f12; --done: #7fdca3; --done-bg: #17382a; --stale: #ff9a9a; --stale-bg: #3f1c1c;
  --lock-bg: #1c2642; --focus: #7aa8ff; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1626; --surface: #172039; --ink: #eef1f8; --ink-2: #aab4cc; --line: #2a3556; --soft: #1e2946;
  --navy: #eef1f8; --orange: #ff8a3d; --orange-ink: #ffa566; --orange-soft: #3a2415;
  --todo: #b3bcd3; --todo-bg: #25304f; --prog: #ffcb70; --prog-bg: #3d2f12; --done: #7fdca3; --done-bg: #17382a; --stale: #ff9a9a; --stale-bg: #3f1c1c;
  --lock-bg: #1c2642; --focus: #7aa8ff; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); }
.wrap { max-width: 1020px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 56px; }
h1, h2, h3 { font-family: var(--display); color: var(--navy); margin: 0; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.fixture { background: var(--orange-soft); border: 1px dashed var(--orange); color: var(--orange-ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 13px; margin-bottom: 18px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: end; justify-content: space-between; margin-bottom: 16px; }
.top h1 { font-size: 30px; line-height: 1.15; }
.eyebrow { font: 600 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.count { display: flex; gap: 8px; flex-wrap: wrap; }
.count span { font-weight: 600; font-size: 13px; padding: 4px 11px; border-radius: 999px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 22px; padding: 0; list-style: none; counter-reset: s; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 46px; position: relative; font-size: 14px; counter-increment: s; min-width: 0; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 11px; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: var(--bg); font: 700 13px/24px var(--display); text-align: center; }
.steps b { display: block; font-family: var(--display); font-size: 15px; color: var(--navy); }

/* cards */
.cards { display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-start; justify-content: space-between; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }

.card-head h2 { font-size: 21px; line-height: 1.2; }
.meta { color: var(--ink-2); font-size: 13px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px; padding: 5px 13px 5px 10px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.s-todo { color: var(--todo); background: var(--todo-bg); } .s-prog { color: var(--prog); background: var(--prog-bg); } .s-done { color: var(--done); background: var(--done-bg); }

.stale { background: var(--stale-bg); color: var(--stale); }
.body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }

.col + .col { border-left: 1px solid var(--line); }

.where { display: flex; gap: 14px; align-items: center; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 9px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--stale-bg); color: var(--stale); border-radius: 6px; padding: 3px 9px; font-size: 13px; font-weight: 500; }
.hint { color: var(--ink-2); font-size: 13px; }
.copied { color: var(--done); font-weight: 600; font-size: 13px; }

.lock .note svg { flex: none; margin-top: 2px; }
.spec { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 14px; }
.spec dt { color: var(--ink-2); } .spec dd { margin: 0; font-weight: 500; }

.hist tr.cur td:first-child { font-weight: 700; color: var(--navy); }
.vwrap { overflow-x: auto; }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }

.seg button[aria-pressed="true"].s-done { background: var(--done-bg); color: var(--done); }
.seg button[disabled] { opacity: .45; cursor: not-allowed; }

.msg { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.msg b { font-weight: 700; color: var(--navy); } .msg time { color: var(--ink-2); font-size: 12px; margin-left: 6px; }

.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 12px; background: var(--surface); }
.foot { margin-top: 24px; color: var(--ink-2); font-size: 13px; }
@media (max-width: 820px) {
  .steps { grid-template-columns: 1fr 1fr; } .body { grid-template-columns: 1fr; } .col + .col { border-left: 0; border-top: 1px solid var(--line); }
  .top h1 { font-size: 25px; }

@media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

    var noteIn = el('input', { type: 'text', id: 'n-' + c.card_id.replace(':', '-'), placeholder: 'Ask a question or leave a note', 'aria-label': 'Note for card ' + n });
    var send = function () { var t = noteIn.value.trim(); if (!t) return; st.notes.push({ who: ME, at: today(), text: t }); save(c.card_id); render(); };
    noteIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

    var right = el('div', { class: 'col' }, [
      sec(2, 'Text to add yourself (read-only)', [lockBox]),
      sec(null, 'Size and file', [spec]),
      sec(3, 'Hand in', [drop, fileInput]),
      sec(4, 'Status', [seg, !img ? el('p', { class: 'hint', style: 'margin-top:6px', text: 'Done unlocks once an image for the current card version is uploaded.' }) : null]),
    ]);
    var bottom = el('div', { class: 'body', style: 'border-top:1px solid var(--line)' }, [
      el('div', { class: 'col' }, [sec(null, 'Version history', [hist])]),
      el('div', { class: 'col' }, [sec(null, 'Notes on this card', [thread, el('div', { class: 'add' }, [noteIn, el('button', { class: 'btn', type: 'button', onclick: send, text: 'Send' })])])]),
    ]);
    return el('article', { class: 'card', 'aria-label': c.title }, [head, el('div', { class: 'body' }, [left, right]), bottom]);
  }
  function sec(n, title, kids) { return el('div', { class: 'sec' }, [el('h3', {}, [n ? el('span', { class: 'n', text: String(n) }) : null, title])].concat(kids)); }

  function upload(c, file) {
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert10(); return; }
    var st = S[c.card_id]; var v = st.uploads.length + 1;
    var finish = function (assetId, thumb) {
      st.uploads.push({ v: v, for_card_version: c.card_version, file_name: file.name, date: today(), asset_id: assetId || null, thumb: thumb || null });
      if (st.state === 'todo') st.state = 'prog'; save(c.card_id); render();
    };
    var thumb = URL.createObjectURL(file);
    Promise.resolve(window.claude && window.claude.use ? window.claude.use('assets') : null).then(function (assets) {
      if (!assets) return finish(null, thumb);
      return assets.upload(file).then(function (r) { finish(r.id, r.url); }, function () { finish(null, thumb); });
    }).catch(function () { finish(null, thumb); });
  }
  function alert10() { var m = document.createElement('div'); m.className = 'fixture'; m.textContent = 'That file is over 10 MB. Export a smaller one and try again.'; app.insertBefore(m, app.firstChild); setTimeout(function () { m.remove(); }, 4000); }

  render();
  load().then(render);
})();
</script>
